<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Photographique — Maquette d'exposition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
        #instructions {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: transparent;
            color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            z-index: 100; cursor: pointer; user-select: none;
            transition: opacity 1s ease;
        }
        #instructions.hidden { opacity: 0; pointer-events: none; }
        #instructions h1 {
            font-size: 1.1rem; font-weight: 300; letter-spacing: 0.25em;
            margin-bottom: 2rem; text-transform: uppercase;
        }
        #instructions p {
            font-size: 0.75rem; font-weight: 300; letter-spacing: 0.2em;
            color: #666; line-height: 2.4; text-align: center;
        }
        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 12px; height: 12px; z-index: 50; pointer-events: none; display: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.2);
        }
        #crosshair::before { width: 1px; height: 100%; left: 50%; top: 0; }
        #crosshair::after { width: 100%; height: 1px; top: 50%; left: 0; }
        #vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10; display: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
        }
        #hint {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
            color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
            pointer-events: none; z-index: 60;
            opacity: 0; transition: opacity 0.8s ease;
        }
        #hint.visible { opacity: 0.4; }
    </style>
</head>
<body>
    <div id="instructions">
        <h1>Cliquer pour entrer</h1>
        <p>ZQSD pour se déplacer<br>Souris pour regarder</p>
    </div>
    <div id="crosshair"></div>
    <div id="vignette"></div>
    <div id="hint">Cliquer sur la projection</div>
    <div id="info-overlay" style="
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.75); z-index: 80;
        opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #ccc;
    ">
        <div style="text-align: center; max-width: 500px; line-height: 2.2; font-size: 13px; letter-spacing: 0.1em;">
            <div style="font-size: 18px; font-weight: 300; letter-spacing: 0.25em; margin-bottom: 24px; color: #fff;">VOLUME PHOTOGRAPHIQUE</div>
            <div style="color: #999;">Holosene, 2025-2026</div>
            <div style="color: #999;">Photographies : Nicolas Floc'h</div>
            <div style="color: #999;">Série Invisible, Calanques, 2018-2020</div>
            <div style="margin-top: 16px; color: #666; font-size: 11px;">Scroll pour zoomer &middot; Échap pour revenir</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    (function() {
        'use strict';

        // =============================================
        // CONSTANTES ESPACE
        // =============================================
        const ROOM_W = 30, ROOM_D = 20, ROOM_H = 8;
        const EYE_HEIGHT = 1.65;
        const MOVE_SPEED = 3.5;
        const MOUSE_SENS = 0.002;
        const PITCH_LIMIT = Math.PI * 85 / 180;

        const SCREEN_W = 10, SCREEN_H = 5.625; // 16:9
        const SCREEN_BOTTOM = 1.0;
        const SCREEN_CENTER_Y = SCREEN_BOTTOM + SCREEN_H / 2;

        const INTERACTION_DIST = 5;

        // =============================================
        // RENDERER
        // =============================================
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.8;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.physicallyCorrectLights = true;
        document.body.appendChild(renderer.domElement);

        // =============================================
        // SCENE & CAMERA
        // =============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.008);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 60);
        camera.position.set(0, EYE_HEIGHT, ROOM_D / 2 - 3);

        // =============================================
        // IFRAME — EMBED DU VRAI INDEX.HTML
        // =============================================
        let iframeCanvas = null;
        let screenTexture = null;
        let iframeReady = false;
        let iframeWindow = null;

        function setupIframe() {
            const iframe = document.createElement('iframe');
            iframe.src = './index.html';
            iframe.style.cssText = 'position:absolute; width:1920px; height:1080px; left:-9999px; top:-9999px; opacity:0; pointer-events:none; border:none;';
            document.body.appendChild(iframe);

            iframe.onload = () => {
                try {
                    iframeWindow = iframe.contentWindow;
                    const iDoc = iframe.contentDocument;

                    // Auto-dismiss click-gate
                    const autoDismiss = () => {
                        const clickGate = iDoc.getElementById('click-gate');
                        if (clickGate) {
                            clickGate.click();
                        }

                        // Wait then dismiss landing page
                        setTimeout(() => {
                            const landing = iDoc.getElementById('landing-page');
                            if (landing) {
                                // Simulate scroll to dismiss
                                iframeWindow.dispatchEvent(new WheelEvent('wheel', {
                                    deltaY: 100, bubbles: true, cancelable: true
                                }));
                            }

                            // Dismiss intro page
                            setTimeout(() => {
                                const intro = iDoc.getElementById('intro-page');
                                if (intro) {
                                    iframeWindow.dispatchEvent(new WheelEvent('wheel', {
                                        deltaY: 100, bubbles: true, cancelable: true
                                    }));
                                }

                                // Wait for experience to be active, grab canvas
                                setTimeout(() => {
                                    iframeCanvas = iDoc.querySelector('canvas');
                                    if (iframeCanvas) {
                                        screenTexture = new THREE.CanvasTexture(iframeCanvas);
                                        screenTexture.minFilter = THREE.LinearFilter;
                                        screenTexture.magFilter = THREE.LinearFilter;
                                        screenTexture.encoding = THREE.sRGBEncoding;
                                        if (screenMesh) {
                                            screenMesh.material.map = screenTexture;
                                            screenMesh.material.needsUpdate = true;
                                            reflectMesh.material.map = screenTexture;
                                            reflectMesh.material.needsUpdate = true;
                                        }
                                        iframeReady = true;
                                    }
                                }, 3000);
                            }, 3000);
                        }, 3000);
                    };

                    // Start dismiss sequence
                    setTimeout(autoDismiss, 1000);

                } catch (e) {
                    // CORS blocked — fall back to built-in particle engine
                    console.warn('Iframe access blocked, using fallback particle engine', e);
                    setupFallbackParticles();
                }
            };

            iframe.onerror = () => {
                setupFallbackParticles();
            };
        }

        // =============================================
        // FALLBACK PARTICLE ENGINE (if iframe fails)
        // =============================================
        const RT_W = 1920, RT_H = 1080;
        let renderTarget = null;
        let particleScene = null;
        let particleCamera = null;
        let particles = null;
        let useFallback = false;

        // 7 Floc'h gradients
        const GRADIENTS = [
            [{ d:-0.50,r:0.059,g:0.137,b:0.102 },{d:-0.25,r:0.067,g:0.200,b:0.125},{d:0,r:0.075,g:0.373,b:0.184},{d:0.25,r:0.153,g:0.498,b:0.267},{d:0.50,r:0.212,g:0.518,b:0.290}],
            [{ d:-0.50,r:0.047,g:0.192,b:0.149 },{d:-0.25,r:0.043,g:0.329,b:0.235},{d:0,r:0.086,g:0.482,b:0.353},{d:0.25,r:0.224,g:0.624,b:0.506},{d:0.50,r:0.325,g:0.651,b:0.549}],
            [{ d:-0.50,r:0.008,g:0.227,b:0.267 },{d:-0.25,r:0.004,g:0.212,b:0.216},{d:0,r:0.004,g:0.475,b:0.475},{d:0.25,r:0.055,g:0.580,b:0.553},{d:0.50,r:0.161,g:0.675,b:0.612}],
            [{ d:-0.50,r:0.016,g:0.173,b:0.227 },{d:-0.25,r:0.016,g:0.267,b:0.333},{d:0,r:0.004,g:0.420,b:0.486},{d:0.25,r:0.039,g:0.553,b:0.592},{d:0.50,r:0.090,g:0.651,b:0.702}],
            [{ d:-0.50,r:0.008,g:0.176,b:0.310 },{d:-0.25,r:0.004,g:0.255,b:0.424},{d:0,r:0.004,g:0.373,b:0.537},{d:0.25,r:0.004,g:0.506,b:0.663},{d:0.50,r:0.004,g:0.588,b:0.702}],
            [{ d:-0.50,r:0.004,g:0.169,b:0.310 },{d:-0.25,r:0.004,g:0.251,b:0.447},{d:0,r:0.004,g:0.396,b:0.620},{d:0.25,r:0.004,g:0.525,b:0.714},{d:0.50,r:0.004,g:0.596,b:0.749}],
            [{ d:-0.50,r:0.000,g:0.141,b:0.271 },{d:-0.25,r:0.004,g:0.204,b:0.388},{d:0,r:0.004,g:0.286,b:0.525},{d:0.25,r:0.004,g:0.357,b:0.616},{d:0.50,r:0.004,g:0.400,b:0.675}]
        ];

        const UX_STATES = [
            { disparity: 0,   movement: 0 },
            { disparity: 0.7, movement: 0.008 },
            { disparity: 2.0, movement: 0.025 },
            { disparity: 3.5, movement: 0.06 },
            { disparity: 5.2, movement: 0.15 },
            { disparity: 6.2, movement: 0.35 },
            { disparity: 7.0, movement: 0.5 }
        ];

        const MAX_ZOOM_LEVEL = 0.826632;
        const TRANSITION_END_ZOOM = 0.418116;
        const TRANSITION_DISTANCE = MAX_ZOOM_LEVEL - TRANSITION_END_ZOOM;
        const PARTICLE_COUNT = 120000;

        let currentImageIndex = 0;
        let imageData = [];
        let zoomLevel = 0, targetZoomLevel = 0;
        let scrollPhase = 'zoomIn';
        let hasTriggeredTransition = false;
        let transitionOld = null, transitionNew = null;
        let currentAppliedDisparity = 0;
        let particleMovementOffsets = null;

        function seededRandom(x, y, seed) {
            let h = seed + x * 374761393 + y * 668265263;
            h = (h ^ (h >> 13)) * 1274126177;
            h = h ^ (h >> 16);
            return (h & 0x7fffffff) / 0x7fffffff;
        }

        function colorFromLuminance(luminance, gradientIndex) {
            const grad = GRADIENTS[gradientIndex];
            const depth = luminance - 0.5;
            let lo = grad[0], hi = grad[grad.length - 1];
            for (let i = 0; i < grad.length - 1; i++) {
                if (depth >= grad[i].d && depth <= grad[i + 1].d) {
                    lo = grad[i]; hi = grad[i + 1]; break;
                }
            }
            const range = hi.d - lo.d;
            const t = range > 0 ? (depth - lo.d) / range : 0;
            const lm = luminance * 2.0;
            return {
                r: (lo.r + (hi.r - lo.r) * t) * lm,
                g: (lo.g + (hi.g - lo.g) * t) * lm,
                b: (lo.b + (hi.b - lo.b) * t) * lm
            };
        }

        function interpolateUXState(progress) {
            const scaled = Math.max(0, Math.min(1, progress)) * (UX_STATES.length - 1);
            const idx = Math.min(Math.floor(scaled), UX_STATES.length - 2);
            const t = scaled - idx;
            return {
                disparity: UX_STATES[idx].disparity + (UX_STATES[idx + 1].disparity - UX_STATES[idx].disparity) * t,
                movement: UX_STATES[idx].movement + (UX_STATES[idx + 1].movement - UX_STATES[idx].movement) * t
            };
        }

        function setupFallbackParticles() {
            useFallback = true;

            renderTarget = new THREE.WebGLRenderTarget(RT_W, RT_H, {
                minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat
            });

            particleScene = new THREE.Scene();
            particleScene.background = new THREE.Color(0x000000);

            particleCamera = new THREE.PerspectiveCamera(45, RT_W / RT_H, 0.1, 100);
            particleCamera.position.set(0, 0, 25);

            const count = PARTICLE_COUNT;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const depths = new Float32Array(count);
            const scaleFactor = 50;
            const gridW = Math.ceil(Math.sqrt(count * (16 / 9)));
            const gridH = Math.ceil(count / gridW);

            for (let i = 0; i < count; i++) {
                const gx = i % gridW, gy = Math.floor(i / gridW);
                const nx = gx / gridW, ny = gy / gridH;
                const x = (nx - 0.5) * (RT_W / scaleFactor);
                const y = (0.5 - ny) * (RT_H / scaleFactor);
                const d = Math.sin(nx * 2.5 * Math.PI) * Math.cos(ny * 1.8 * Math.PI) * 0.5
                        + Math.sin(nx * 5 * Math.PI + 1.3) * Math.cos(ny * 5 * Math.PI + 0.7) * 0.2
                        + (1 - ny) * 0.3 - 0.15;
                depths[i] = d;
                const jx = (seededRandom(gx, gy, 7) - 0.5) * 0.4;
                const jy = (seededRandom(gx, gy, 8) - 0.5) * 0.4;
                positions[i * 3] = x + jx;
                positions[i * 3 + 1] = y + jy;
                positions[i * 3 + 2] = 0;
                const lum = d + 0.5;
                const c = colorFromLuminance(lum, 2);
                colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
            }

            particleMovementOffsets = new Float32Array(count * 2);
            for (let i = 0; i < count; i++) {
                particleMovementOffsets[i * 2] = (seededRandom(i, 0, 11) - 0.5) * 2;
                particleMovementOffsets[i * 2 + 1] = (seededRandom(i, 0, 12) - 0.5) * 2;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Circle particle texture
            const tc = document.createElement('canvas');
            tc.width = 64; tc.height = 64;
            const tCtx = tc.getContext('2d');
            const grad = tCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.5, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            tCtx.fillStyle = grad;
            tCtx.fillRect(0, 0, 64, 64);

            particles = new THREE.Points(geo, new THREE.PointsMaterial({
                size: 0.04, vertexColors: true, sizeAttenuation: true,
                transparent: true, opacity: 1, map: new THREE.CanvasTexture(tc),
                depthWrite: false, blending: THREE.NormalBlending
            }));
            particles.rotation.x = Math.PI;
            particles.userData.depths = depths;
            particles.userData.basePositions = new Float32Array(positions);
            particleScene.add(particles);

            // Apply to screen
            if (screenMesh) {
                screenMesh.material.map = renderTarget.texture;
                screenMesh.material.needsUpdate = true;
                reflectMesh.material.map = renderTarget.texture;
                reflectMesh.material.needsUpdate = true;
            }

            // Load first image
            loadImage(0, (data) => { applyImageData(data); loadImage(1); });
        }

        function loadImage(index, callback) {
            if (imageData[index] && imageData[index].loaded) {
                if (callback) callback(imageData[index]);
                return;
            }
            const pad = String(index + 1).padStart(3, '0');
            const imgPath = './Ressources/photographies/IMG_' + pad + '.jpg';
            const depthPath = './Ressources/photographies/IMG_' + pad + '_depth.png';
            const img = new Image(), depthImg = new Image();
            let il = false, dl = false, df = false;

            function fin() {
                if (!il || (!dl && !df)) return;
                const cvs = document.createElement('canvas');
                const sw = 420, sh = Math.round(sw * img.height / img.width);
                cvs.width = sw; cvs.height = sh;
                const ctx = cvs.getContext('2d');
                ctx.drawImage(img, 0, 0, sw, sh);
                const px = ctx.getImageData(0, 0, sw, sh).data;
                let dpx = null;
                if (dl) {
                    const dc = document.createElement('canvas');
                    dc.width = sw; dc.height = sh;
                    const dctx = dc.getContext('2d');
                    dctx.drawImage(depthImg, 0, 0, sw, sh);
                    dpx = dctx.getImageData(0, 0, sw, sh).data;
                }
                const count = Math.min(PARTICLE_COUNT, sw * sh);
                const step = Math.max(1, Math.floor(sw * sh / count));
                const nc = new Float32Array(count * 3), nd = new Float32Array(count);
                const sf = 50;
                let idx = 0;
                for (let p = 0; p < sw * sh && idx < count; p += step) {
                    const ppx = p % sw, ppy = Math.floor(p / sw);
                    const pi = (ppy * sw + ppx) * 4;
                    const r = px[pi]/255, g = px[pi+1]/255, b = px[pi+2]/255;
                    const lum = 0.299*r + 0.587*g + 0.114*b;
                    let macro = lum - 0.5;
                    if (dpx) macro = dpx[pi]/255 - 0.5;
                    const micro = lum - 0.5;
                    const noise = (seededRandom(ppx, ppy, 3) - 0.5) * 0.02;
                    nd[idx] = dpx ? macro*0.9 + micro*0.1 + noise : micro + noise;
                    const c = colorFromLuminance(lum, index);
                    nc[idx*3] = r*0.15 + c.r*0.85;
                    nc[idx*3+1] = g*0.15 + c.g*0.85;
                    nc[idx*3+2] = b*0.15 + c.b*0.85;
                    idx++;
                }
                // Update base positions
                if (particles) {
                    const bp = particles.userData.basePositions;
                    let bi = 0;
                    for (let p = 0; p < sw * sh && bi < count; p += step) {
                        const ppx = p % sw, ppy = Math.floor(p / sw);
                        bp[bi*3] = (ppx/sw - 0.5)*(RT_W/sf) + (seededRandom(ppx,ppy,7)-0.5)*0.4;
                        bp[bi*3+1] = (0.5-ppy/sh)*(RT_H/sf) + (seededRandom(ppx,ppy,8)-0.5)*0.4;
                        bi++;
                    }
                }
                imageData[index] = { colors: nc, depths: nd, loaded: true, count: idx };
                if (callback) callback(imageData[index]);
            }
            img.onload = () => { il = true; fin(); };
            img.onerror = () => { il = true; df = true; fin(); };
            depthImg.onload = () => { dl = true; fin(); };
            depthImg.onerror = () => { df = true; fin(); };
            img.src = imgPath; depthImg.src = depthPath;
        }

        function applyImageData(data) {
            if (!particles || !data) return;
            const col = particles.geometry.attributes.color.array;
            const dep = particles.userData.depths;
            const n = Math.min(data.count, dep.length);
            for (let i = 0; i < n * 3; i++) col[i] = data.colors[i];
            for (let i = 0; i < n; i++) dep[i] = data.depths[i];
            particles.geometry.attributes.color.needsUpdate = true;
        }

        function transitionToNextImage() {
            const next = (currentImageIndex + 1) % 7;
            transitionOld = {
                colors: new Float32Array(particles.geometry.attributes.color.array),
                depths: new Float32Array(particles.userData.depths)
            };
            const doIt = (data) => {
                transitionNew = { colors: data.colors, depths: data.depths };
                currentImageIndex = next;
            };
            if (imageData[next] && imageData[next].loaded) doIt(imageData[next]);
            else loadImage(next, doIt);
        }

        // =============================================
        // GALLERY ARCHITECTURE
        // =============================================
        function buildGallery() {
            // Sol béton poli noir — miroir sombre
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a0a, roughness: 0.15, metalness: 0.2
            });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Murs anthracite
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.8 });

            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_H), wallMat);
            backWall.position.set(0, ROOM_H / 2, -ROOM_D / 2);
            backWall.receiveShadow = true;
            scene.add(backWall);

            const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_H), wallMat);
            frontWall.position.set(0, ROOM_H / 2, ROOM_D / 2);
            frontWall.rotation.y = Math.PI;
            scene.add(frontWall);

            const sideGeo = new THREE.PlaneGeometry(ROOM_D, ROOM_H);
            const leftWall = new THREE.Mesh(sideGeo, wallMat);
            leftWall.position.set(-ROOM_W / 2, ROOM_H / 2, 0);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(sideGeo, wallMat);
            rightWall.position.set(ROOM_W / 2, ROOM_H / 2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            scene.add(rightWall);

            // Plafond noir invisible
            const ceilMat = new THREE.MeshStandardMaterial({ color: 0x040404, roughness: 1.0 });
            const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), ceilMat);
            ceil.rotation.x = Math.PI / 2;
            ceil.position.y = ROOM_H;
            scene.add(ceil);
        }

        // =============================================
        // ÉCRAN MONUMENTAL + REFLETS
        // =============================================
        let screenMesh, reflectMesh;

        function buildScreen() {
            // Écran — MeshBasicMaterial (pas affecté par éclairage = lumineux comme un vrai écran)
            const screenMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W, SCREEN_H), screenMat);
            screenMesh.position.set(0, SCREEN_CENTER_Y, -ROOM_D / 2 + 0.01);
            scene.add(screenMesh);

            // Reflet au sol — miroir sombre
            const reflGeo = new THREE.PlaneGeometry(SCREEN_W * 1.4, 8);
            const reflMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            reflectMesh = new THREE.Mesh(reflGeo, reflMat);
            reflectMesh.rotation.x = -Math.PI / 2;
            // Flip UV vertically for mirror
            const uv = reflectMesh.geometry.attributes.uv.array;
            uv[1] = 0; uv[3] = 0; uv[5] = 1; uv[7] = 1;
            reflectMesh.geometry.attributes.uv.needsUpdate = true;
            reflectMesh.position.set(0, 0.002, -ROOM_D / 2 + 4.5);
            scene.add(reflectMesh);

            // Gradient d'estompage du reflet (plus loin = plus sombre)
            const fadeGeo = new THREE.PlaneGeometry(SCREEN_W * 1.4, 5);
            const fadeMat = new THREE.MeshBasicMaterial({
                color: 0x000000, transparent: true, opacity: 0.85, depthWrite: false
            });
            const fade = new THREE.Mesh(fadeGeo, fadeMat);
            fade.rotation.x = -Math.PI / 2;
            fade.position.set(0, 0.003, -ROOM_D / 2 + 9);
            scene.add(fade);
        }

        // =============================================
        // ÉCLAIRAGE
        // =============================================
        function buildLighting() {
            // Ambient — assez pour deviner les murs
            scene.add(new THREE.AmbientLight(0xffffff, 0.08));

            // Lumière projetée par l'écran — cyan turquoise irradiant dans la salle
            // Simule la lumière réelle d'un écran monumental dans le noir
            const screenLight = new THREE.PointLight(0x17A6B3, 2.0, 16, 1.5);
            screenLight.position.set(0, SCREEN_CENTER_Y, -ROOM_D / 2 + 2);
            scene.add(screenLight);

            // Deuxième point light plus bas pour éclairer le sol
            const floorLight = new THREE.PointLight(0x17A6B3, 1.0, 12, 2);
            floorLight.position.set(0, 0.8, -ROOM_D / 2 + 3);
            scene.add(floorLight);

            // Spot unique discret au plafond → sol devant l'écran
            const spot = new THREE.SpotLight(0xfff8f0, 0.3, 20, Math.PI / 7, 0.9, 2);
            spot.position.set(0, ROOM_H - 0.1, -ROOM_D / 2 + 6);
            spot.target.position.set(0, 0, -ROOM_D / 2 + 4);
            spot.castShadow = true;
            spot.shadow.mapSize.set(1024, 1024);

            scene.add(spot);

            const backAmbient = new THREE.PointLight(0xeeeeff, 0.25, 18, 2);
            backAmbient.position.set(0, 4, ROOM_D / 2 - 3);

            // Lumières latérales très douces pour deviner les murs
            const leftFill = new THREE.PointLight(0xddeeff, 0.1, 14, 2);
            leftFill.position.set(-ROOM_W / 2 + 2, 3, 0);
            scene.add(leftFill);
            const rightFill = new THREE.PointLight(0xddeeff, 0.1, 14, 2);
            rightFill.position.set(ROOM_W / 2 - 2, 3, 0);
            scene.add(rightFill);
        }

        // =============================================
        // CHEMIN LED AU SOL
        // =============================================
        function buildLedPath() {
            const pathMat = new THREE.LineBasicMaterial({
                color: 0xffffff, transparent: true, opacity: 0.07
            });
            const startZ = ROOM_D / 2 - 2;
            const endZ = -ROOM_D / 2 + INTERACTION_DIST + 1;
            const pts = [];
            const segments = 40;
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const z = startZ + (endZ - startZ) * t;
                const x = Math.sin(t * Math.PI * 2) * 0.15;
                pts.push(new THREE.Vector3(x, 0.003, z));
            }
            scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), pathMat));

            const dotMat = new THREE.MeshBasicMaterial({
                color: 0xffffff, transparent: true, opacity: 0.06
            });
            for (let i = 0; i <= segments; i += 5) {
                const dot = new THREE.Mesh(new THREE.CircleGeometry(0.025, 8), dotMat);
                dot.rotation.x = -Math.PI / 2;
                dot.position.copy(pts[i]);
                dot.position.y = 0.004;
                scene.add(dot);
            }
        }

        // =============================================
        // CARTEL RÉTRO-ÉCLAIRÉ
        // =============================================
        function buildCartel() {
            const canvas = document.createElement('canvas');
            const cW = 600, cH = 500;
            canvas.width = cW; canvas.height = cH;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(8, 8, 8, 0.92)';
            ctx.fillRect(0, 0, cW, cH);

            ctx.fillStyle = '#eeeeee';
            ctx.font = '500 26px "Helvetica Neue", Helvetica, Arial, sans-serif';
            ctx.fillText('VOLUME PHOTOGRAPHIQUE', 36, 50);

            ctx.fillStyle = '#666';
            ctx.fillRect(36, 70, 50, 1);

            ctx.font = '300 17px "Helvetica Neue", Helvetica, Arial, sans-serif';
            ctx.fillStyle = '#bbbbbb';
            const lines = [
                'Holosene, 2025-2026', '',
                'Photographies : Nicolas Floc\'h',
                'Série Invisible, Calanques, 2018-2020',
                'Palette : La couleur de l\'eau,',
                'FRAC PACA, 2020', '',
                'Three.js, Web Audio API,',
                'Depth Anything V2', '',
                'Expérience web interactive'
            ];
            let y = 100;
            for (const l of lines) {
                if (l) ctx.fillText(l, 36, y);
                y += l ? 26 : 14;
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            const cartel = new THREE.Mesh(
                new THREE.PlaneGeometry(0.5, 0.5 * cH / cW),
                new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 1.0 })
            );
            cartel.position.set(SCREEN_W / 2 + 0.8, SCREEN_BOTTOM + 0.5, -ROOM_D / 2 + 0.015);

                    color: 0xffffff, transparent: true, opacity: 0.04,
                    blending: THREE.AdditiveBlending

            );
            halo.position.set(cartel.position.x, cartel.position.y, -ROOM_D / 2 + 0.005);
            scene.add(halo);

        // =============================================
        // BANC MINIMALISTE

        function buildBench() {

            const metalMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.3, metalness: 0.8 });

        // =============================================
        // CONTRÔLES
        // =============================================
        let controlMode = 'gallery';
        let yaw = 0, pitch = 0;
        const keys = {};
        let isLocked = false;

        const instructionsEl = document.getElementById('instructions');
        const crosshairEl = document.getElementById('crosshair');
        const vignetteEl = document.getElementById('vignette');
        const hintEl = document.getElementById('hint');

        const infoOverlay = document.getElementById('info-overlay');
        let infoVisible = false;

        function showInfo() {
            if (infoVisible) return;
            infoVisible = true;
            infoOverlay.style.opacity = '1';
            infoOverlay.style.pointerEvents = 'auto';
        }
        function hideInfo() {
            if (!infoVisible) return;
            infoVisible = false;
            infoOverlay.style.opacity = '0';
            infoOverlay.style.pointerEvents = 'none';
        }

        document.addEventListener('click', (e) => {
            if (!isLocked) {
                renderer.domElement.requestPointerLock();
                return;
            }

            // In installation mode: left click toggles info (like index.html)
            if (controlMode === 'installation') {
                // Don't toggle if it was a right-click (handled by contextmenu)
                return;
            }

            if (controlMode === 'gallery' && isLocked && screenMesh) {
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(0, 0), camera);
                const hits = ray.intersectObject(screenMesh);
                if (hits.length > 0) {
                    const dist = camera.position.distanceTo(screenMesh.position);
                    if (dist < INTERACTION_DIST + 5) {
                        enterInstallationMode();
                    }
                }
            }
        });

        // Right-click or Alt: toggle info overlay in installation mode
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (controlMode === 'installation') {
                if (infoVisible) hideInfo(); else showInfo();
            }
        });

        function enterInstallationMode() {
            controlMode = 'installation';
            hintEl.classList.remove('visible');
            // Keep crosshair visible — user can still look around
        }

        function exitInstallationMode() {
            controlMode = 'gallery';
            hideInfo();
            crosshairEl.style.display = isLocked ? 'block' : 'none';
        }

        document.addEventListener('pointerlockchange', () => {
            isLocked = !!document.pointerLockElement;
            if (isLocked) {
                instructionsEl.classList.add('hidden');
                crosshairEl.style.display = 'block';
                vignetteEl.style.display = 'block';
            } else {
                crosshairEl.style.display = 'none';
                if (controlMode === 'installation') exitInstallationMode();
            }
        });

        // Mouse ALWAYS controls camera — even in installation mode
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * MOUSE_SENS;
            pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch - e.movementY * MOUSE_SENS));
        });

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.key === 'Escape' && controlMode === 'installation') {
                exitInstallationMode();
                e.preventDefault();
            }
            // Alt toggles info in installation mode
            if (e.key === 'Alt' && controlMode === 'installation') {
                if (infoVisible) hideInfo(); else showInfo();
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Scroll
        let deadZoneAccum = 0, inDeadZone = false;
        const DEAD_ZONE = 0.1;

        document.addEventListener('wheel', (e) => {
            if (controlMode !== 'installation') return;
            e.preventDefault();

            // If iframe is active, forward scroll to it
            if (iframeReady && iframeWindow) {
                try {
                    iframeWindow.dispatchEvent(new WheelEvent('wheel', {
                        deltaY: e.deltaY,
                        deltaX: e.deltaX,
                        deltaMode: e.deltaMode,
                        bubbles: true,
                        cancelable: true
                    }));
                } catch (err) {
                    // fallback handled below
                }
            }

            // Also drive fallback engine (active if useFallback, harmless otherwise)
            if (useFallback) {
                const delta = Math.abs(e.deltaY) * 0.00045;
                if (inDeadZone) {
                    deadZoneAccum += delta;
                    if (deadZoneAccum >= DEAD_ZONE) { inDeadZone = false; deadZoneAccum = 0; }
                    return;
                }
                if (scrollPhase === 'zoomIn') {
                    targetZoomLevel = Math.min(targetZoomLevel + delta, MAX_ZOOM_LEVEL);
                } else {
                    targetZoomLevel = Math.max(targetZoomLevel - delta, 0);
                }
            }
        }, { passive: false });

        function updateMovement(dt) {
            if (!isLocked) return;

            // Camera look — ALWAYS active (both modes)
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

            // ZQSD movement — works in BOTH modes
            const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
            const rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
            const vel = new THREE.Vector3();

            if (keys['KeyW'] || keys['KeyZ'] || keys['ArrowUp'])    vel.add(fwd);
            if (keys['KeyS'] || keys['ArrowDown'])                  vel.sub(fwd);
            if (keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft'])  vel.sub(rgt);
            if (keys['KeyD'] || keys['ArrowRight'])                 vel.add(rgt);

            if (vel.lengthSq() > 0) {
                vel.normalize().multiplyScalar(MOVE_SPEED * dt);
                camera.position.add(vel);
            }

            const m = 0.3;
            camera.position.x = Math.max(-ROOM_W/2 + m, Math.min(ROOM_W/2 - m, camera.position.x));
            camera.position.z = Math.max(-ROOM_D/2 + m, Math.min(ROOM_D/2 - m, camera.position.z));
            camera.position.y = EYE_HEIGHT;

            // Auto-exit installation mode if too far from screen
            if (controlMode === 'installation') {
                const screenDist = camera.position.distanceTo(new THREE.Vector3(0, SCREEN_CENTER_Y, -ROOM_D / 2));
                if (screenDist > INTERACTION_DIST + 8) {
                    exitInstallationMode();
                }
            }
        }

        function updateHint() {
            if (controlMode === 'installation' || !isLocked) {
                hintEl.classList.remove('visible');
                return;
            }
            const dist = camera.position.distanceTo(new THREE.Vector3(0, SCREEN_CENTER_Y, -ROOM_D / 2));
            hintEl.classList.toggle('visible', dist < INTERACTION_DIST + 3);
        }

        // =============================================
        // BOUCLE D'ANIMATION
        // =============================================
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - prevTime) / 1000, 0.1);
            prevTime = now;
            const t = now / 1000;

            updateMovement(dt);
            updateHint();

            // Sensor LED pulse
            if (sensorLedMat) {
                const pulse = Math.sin(t * 1.5) * 0.3 + 0.7;
                sensorLedMat.color.setRGB(0, pulse, pulse);
            }

            // Update screen texture from iframe
            if (iframeReady && screenTexture) {
                screenTexture.needsUpdate = true;
            }

            // Fallback particle engine
            if (useFallback && particles) {
                const pos = particles.geometry.attributes.position.array;
                const dep = particles.userData.depths;
                const bp = particles.userData.basePositions;
                const col = particles.geometry.attributes.color.array;
                const count = dep.length;

                // Zoom smoothing
                zoomLevel += (targetZoomLevel - zoomLevel) * 0.12;

                // Phase transitions
                if (scrollPhase === 'zoomIn' && zoomLevel >= MAX_ZOOM_LEVEL - 0.001) {
                    if (!hasTriggeredTransition) {
                        transitionToNextImage();
                        hasTriggeredTransition = true;
                    }
                    scrollPhase = 'zoomOut';
                } else if (scrollPhase === 'zoomOut' && zoomLevel <= 0.001) {
                    scrollPhase = 'zoomIn';
                    targetZoomLevel = 0;
                    hasTriggeredTransition = false;
                    inDeadZone = true;
                    deadZoneAccum = 0;
                }

                // Transition interpolation
                if (transitionOld && transitionNew) {
                    const prog = Math.min(1, (MAX_ZOOM_LEVEL - zoomLevel) / TRANSITION_DISTANCE);
                    for (let i = 0; i < count; i++) {
                        const i3 = i * 3;
                        if (i < transitionNew.depths.length) {
                            col[i3]   = transitionOld.colors[i3]   + (transitionNew.colors[i3]   - transitionOld.colors[i3])   * prog;
                            col[i3+1] = transitionOld.colors[i3+1] + (transitionNew.colors[i3+1] - transitionOld.colors[i3+1]) * prog;
                            col[i3+2] = transitionOld.colors[i3+2] + (transitionNew.colors[i3+2] - transitionOld.colors[i3+2]) * prog;
                            dep[i] = transitionOld.depths[i] + (transitionNew.depths[i] - transitionOld.depths[i]) * prog;
                        }
                    }
                    particles.geometry.attributes.color.needsUpdate = true;
                    if (zoomLevel < TRANSITION_END_ZOOM && scrollPhase === 'zoomOut') {
                        applyImageData(imageData[currentImageIndex]);
                        transitionOld = null; transitionNew = null;
                        loadImage((currentImageIndex + 1) % 7);
                    }
                }

                // UX state
                const ux = interpolateUXState(zoomLevel / MAX_ZOOM_LEVEL);
                currentAppliedDisparity += (ux.disparity - currentAppliedDisparity) * 0.23;
                const mv = ux.movement;

                for (let i = 0; i < count; i++) {
                    const i3 = i * 3;
                    const mx = mv > 0 ? Math.sin(t * 0.8 + particleMovementOffsets[i*2] * 5) * mv * 0.5 : 0;
                    const my = mv > 0 ? Math.cos(t * 0.6 + particleMovementOffsets[i*2+1] * 5) * mv * 0.5 : 0;
                    pos[i3]   = bp[i3] + mx;
                    pos[i3+1] = bp[i3+1] + my;
                    pos[i3+2] = dep[i] * currentAppliedDisparity;
                }
                particles.geometry.attributes.position.needsUpdate = true;

                // Camera
                if (controlMode === 'installation') {
                    particleCamera.position.set(0, 0, 25 - 23 * zoomLevel);
                } else {
                    const cyc = t * (2 * Math.PI / 20);
                    particleCamera.position.set(
                        Math.sin(cyc * 0.5) * 0.3,
                        Math.sin(cyc * 0.3 + 1) * 0.15,
                        25 - 5 * (Math.sin(cyc) * 0.5 + 0.5)
                    );
                }
                particleCamera.lookAt(0, 0, 0);

                // Render particles to RT
                renderer.setRenderTarget(renderTarget);
                renderer.render(particleScene, particleCamera);
                renderer.setRenderTarget(null);
            }

            // Render gallery
            renderer.render(scene, camera);
        }

        // =============================================
        // RESIZE
        // =============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // =============================================
        // INIT
        // =============================================
        buildGallery();
        buildScreen();
        buildLighting();
        buildLedPath();
        buildCartel();
        buildSensor();
        buildBench();
        buildSilhouettes();

        // Try iframe first, fallback to built-in engine
        setupIframe();

        // Safety: if iframe doesn't produce a canvas after 12s, use fallback
        setTimeout(() => {
            if (!iframeReady && !useFallback) {
                console.warn('Iframe timeout — switching to fallback particle engine');
                setupFallbackParticles();
            }
        }, 12000);

        animate();

    })();
    </script>
</body>
</html>
